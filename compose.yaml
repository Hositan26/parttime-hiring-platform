services:
  mysql:
    image: mysql:8.0
    container_name: mysql-parttime
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in the root .env file}
      MYSQL_DATABASE: parttime_hiring_platform_dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:-parttime-mysql-data}
