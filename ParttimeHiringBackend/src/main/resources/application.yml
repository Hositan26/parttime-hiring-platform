server:
  port: ${PORT:8088}
  servlet:
    context-path: /parttime_hiring_platform

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/parttime_hiring_platform?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  secret: ${JWT_SECRET}
  valid-duration: 3600
  refreshable-duration: 7200